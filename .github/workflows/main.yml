name: MlFlow-CI
 
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v3
      
      # Setup Python 3.12.7
      # - name: Set up Python 3.12.7
      #   uses: actions/setup-python@v4
      #   with:
      #     python-version: "3.12.7"

      # # Install mlflow
      # - name: Install dependencies
      #   run: |
      #     python -m pip install --upgrade pip
      #     pip install mlflow

      # # Run as a mlflow project
      # - name: Run mlflow project
      #   run: |
      #     mlflow run ./MLProject --env-manager=local
          
      #  # Save models to GitHub Repository
      # - name: Save mlruns to repo
      #   run: |
      #     git config --global user.name ${{ secrets.username }}
      #     git config --global user.email ${{ secrets.email }}
      #     git add mlruns/
      #     git commit -m "Save mlruns from CI run"
      #     git push origin main

      # Generate Dockerfile with MLFlow
      - name: Generate Dockerfile with MLFlow
        run: |
          MODEL_PATH=$(find mlruns -name MLmodel | head -n 1 | xargs dirname)
          mlflow models generate-dockerfile \
            -m $MODEL_PATH \
            --output-directory crops_recommendation_docker

      # Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Extract Commit SHA
      - name: Extract commit SHA
        id: meta
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Setup buildx (REQUIRED)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push image to DockerHub
      - name: Build and push image to DockerHub
        uses: docker/build-push-action@v7
        with:
          context: ./crops_recommendation_docker
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}:${{ steps.meta.outputs.SHORT_SHA }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache